name: AISE Virtual CI

on:
  push:
    branches:
      - main
      - integration/unified-aise-platform
  pull_request:
    branches:
      - main
      - integration/unified-aise-platform

permissions:
  contents: read

jobs:
  verify:
    name: Tests, lint, and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run automated tests
        run: bun run test
      - name: Run lint
        run: bun run lint
      - name: Build production application
        run: bun run build
